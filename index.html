<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Descargas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-image: url('fondo.png'); /* Mantiene tu imagen de fondo original */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .contenedor-login {
            background-color: rgba(22, 27, 34, 0.85); /* Fondo oscuro semitransparente original */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
            backdrop-filter: blur(5px);
        }
        .avatar-circular {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        h3 {
            margin: 10px 0;
            color: #58a6ff;
        }
        p {
            color: #c9d1d9;
            font-size: 14px;
            margin-bottom: 15px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: white;
            text-align: center;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea043;
        }
        .seccion-descargas {
            margin-top: 15px;
        }
        .carpeta-link {
            display: block;
            background-color: #21262d;
            color: #58a6ff;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #30363d;
            text-align: center;
        }
        .carpeta-link:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>

    <div class="contenedor-login">
        <!-- PANTALLA DE INICIO DE SESIÓN -->
        <div id="pantallaLogin">
            <img src="logo.png" alt="Avatar" class="avatar-circular">
            <h3>elhackerleo</h3>
            <p>Contraseña requerida</p>
            <input type="password" id="inputClave" placeholder="Ingresa la clave">
            <button onclick="verificarClave()">Desbloquear</button>
        </div>

        <!-- PANTALLA DE DESCARGAS (OCULTA AL INICIO) -->
        <div id="pantallaDescargas" style="display: none;">
            <img src="logo.png" alt="Avatar" class="avatar-circular">
            <h3>Panel de Descargas</h3>
            <p>Aplicaciones de Windows disponibles:</p>
            
            <div class="seccion-descargas">
                <a href="https://google.com" class="carpeta-link" target="_blank">🖨️ Descargar Driver HP</a>
                <a href="SOLAMENTEOFFICEDesktopInstaller (1).exe" class="carpeta-link" download>📄 Descargar SOLAMENTE OFFICE</a>
                <a href="wrar370es (1).exe" class="carpeta-link" download>📦 Descargar WinRAR</a>
            </div>
        </div>
    </div>

    <script>
        function verificarClave() {
            var password = document.getElementById('inputClave').value;
            
            if (password === '11') {
                document.getElementById('pantallaLogin').style.display = 'none';
                document.getElementById('pantallaDescargas').style.display = 'block';
            } else {
                alert('Acceso denegado. Clave incorrecta.');
                document.getElementById('inputClave').value = '';
            }
        }
    </script>

</body>
</html>
