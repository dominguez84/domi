
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b12">
    <title>SOPORTE JAIMES 84</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            background:
                linear-gradient(rgba(0, 8, 15, .35), rgba(0, 8, 15, .55)),
                url('fondo.png.jpg') center center / cover fixed no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Efecto de iluminación */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at center,
                transparent 10%, rgba(0, 0, 0, .55) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .contenido {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: aparecer 1.2s ease;
        }

        /* Título principal */
        .titulo {
            color: white;
            font-family: Georgia, serif;
            font-size: clamp(42px, 8vw, 68px);
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 22px;
            text-align: center;
            text-shadow:
                0 0 10px #00d9ff,
                0 0 25px #008cff,
                0 4px 10px black;
            animation: brillo 3s infinite alternate;
        }

        /* Tarjeta de acceso */
        .contenedor-login {
            width: 100%;
            max-width: 370px;
            padding: 30px;
            text-align: center;
            background: rgba(9, 19, 32, .91);
            border: 1px solid rgba(0, 195, 255, .65);
            border-radius: 18px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow:
                0 0 15px rgba(0, 174, 255, .35),
                0 0 45px rgba(0, 174, 255, .15),
                0 15px 40px rgba(0, 0, 0, .7);
            transition: .4s;
        }

        .contenedor-login:hover {
            box-shadow:
                0 0 25px rgba(0, 195, 255, .6),
                0 0 60px rgba(0, 100, 255, .25);
        }

        /* Logo */
        .avatar-circular {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #008cff;
            box-shadow:
                0 0 12px #00bfff,
                0 0 25px rgba(0, 140, 255, .5);
            margin-bottom: 12px;
            animation: flotar 3s ease-in-out infinite;
        }

        h3 {
            color: #00aaff;
            font-size: 23px;
            margin: 10px 0 12px;
            text-shadow: 0 0 10px rgba(0, 150, 255, .5);
        }

        p {
            color: #e3eaf5;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Campo de contraseña */
        input[type="password"] {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #254d70;
            border-radius: 7px;
            background: rgba(3, 12, 25, .9);
            color: white;
            text-align: center;
            outline: none;
            font-size: 14px;
            transition: .3s;
        }

        input[type="password"]:focus {
            border-color: #00c8ff;
            box-shadow: 0 0 12px rgba(0, 195, 255, .5);
        }

        input::placeholder {
            color: #9caec0;
        }

        /* Botones */
        button {
            width: 100%;
            padding: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(90deg, #0066ff, #00baff);
            border: none;
            border-radius: 7px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 140, 255, .35);
            transition: .3s;
        }

        button:hover {
            transform: translateY(-3px);
            background: linear-gradient(90deg, #008cff, #00e1ff);
            box-shadow: 0 0 22px rgba(0, 195, 255, .7);
        }

        button:active {
            transform: scale(.97);
        }

        /* Mensaje de error */
        #mensajeError {
            color: #ff6464;
            font-size: 13px;
            margin: 10px 0 0;
            display: none;
        }

        /* Panel de descargas */
        .seccion-descargas {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .carpeta-link {
            display: block;
            padding: 13px 15px;
            background: rgba(0, 85, 145, .22);
            color: #00c8ff;
            text-decoration: none;
            border: 1px solid #008cff;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: .3s;
        }

        .carpeta-link:hover {
            background: #007bff;
            color: white;
            transform: translateX(5px);
            box-shadow: 0 0 15px #008cff;
        }

        .pie {
            color: rgba(255,255,255,.65);
            font-size: 11px;
            margin-top: 22px;
            letter-spacing: 2px;
        }

        /* Animaciones */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-7px);
            }
        }

        @keyframes brillo {
            from {
                text-shadow: 0 0 10px #00d9ff, 0 0 20px #008cff;
            }
            to {
                text-shadow: 0 0 20px #00eaff, 0 0 40px #008cff;
            }
        }

        /* Adaptación a celulares */
        @media (max-width: 480px) {
            body {
                background-attachment: scroll;
                padding: 20px 12px;
            }

            .titulo {
                margin-bottom: 18px;
            }

            .contenedor-login {
                max-width: 340px;
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="contenido">

    <h1 class="titulo">SOPORTE TÉCNICO</h1>

    <div class="contenedor-login">

        <!-- PANTALLA DE ACCESO -->
        <div id="pantallaLogin">

            <img src="logo.png"
                 alt="Logo ElHackerLeo"
                 class="avatar-circular">

            <h3>DOMINGUEZ JAIMES</h3>

            <p>Contraseña requerida</p>

            <input
                type="password"
                id="inputClave"
                placeholder="Ingresa la clave"
                autocomplete="off"
            >

            <button onclick="verificarClave()">
                Desbloquear
            </button>

            <p id="mensajeError">
                ⚠ Acceso denegado. Clave incorrecta.
            </p>

        </div>

        <!-- PANEL DE DESCARGAS -->
        <div id="pantallaDescargas" style="display:none;">

            <img src="logo.png"
                 alt="Logo ElHackerLeo"
                 class="avatar-circular">

            <h3>PANEL DE DESCARGAS</h3>

            <p>Aplicaciones de Windows disponibles:</p>

            <div class="seccion-descargas">

                <a href="https://drive.google.com/file/d/1K1I8TH8-qz4p1hYNlU6AGc1k0bBA35ev/view?usp=drive_link"
                   class="carpeta-link"
                   target="_blank"
                   rel="noopener noreferrer">
                    🖨️ Descargar Driver HP
                </a>

                <a href="ONLYOFFICEDesktopInstaller%20(1).exe"
                   class="carpeta-link"
                   download>
                    📄 Descargar OFFICE
                </a>

                <a href="wrar370es%20(1).exe"
                   class="carpeta-link"
                   download>
                    📦 Descargar WinRAR
                </a>

                <a href="2019.rar"
                   class="carpeta-link"
                   download>
                    💿 Descargar OFFICE 2019
                </a>

            </div>

        </div>

    </div>

    <div class="pie">
        DOMINGUEZ JAIMES 84 © 2026
    </div>

</div>

<script>

    function verificarClave() {

        const password = document.getElementById('inputClave').value;
        const mensaje = document.getElementById('mensajeError');

        if (password === '2004') {

            document.getElementById('pantallaLogin').style.display = 'none';

            document.getElementById('pantallaDescargas').style.display = 'block';

            mensaje.style.display = 'none';

        } else {

            mensaje.style.display = 'block';

            document.getElementById('inputClave').value = '';

        }

    }

    // Permitir desbloquear presionando ENTER
    document.getElementById('inputClave').addEventListener('keydown', function(event) {

        if (event.key === 'Enter') {
            verificarClave();
        }

    });

</script>

</body>
</html>
