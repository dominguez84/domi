<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elhackerleo</title>
    <style>
        body {
            background-image: url('fondo.png.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor-login {
            background-color: rgba(20, 25, 35, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            width: 350px;
        }

        .avatar-circular {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #007bff;
            margin-bottom: 15px;
        }

        h3 {
            color: #007bff;
            margin-bottom: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        p {
            color: #ffffff;
            margin-bottom: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .seccion-descargas {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .carpeta-link {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1c2434;
            color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
            border: 1px solid #007bff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .carpeta-link:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <div class="contenedor-login">
        <!-- PANTALLA DE INICIO DE SESIÓN -->
        <div id="pantallaLogin">
            <img src="logo.png" alt="Avatar" class="avatar-circular">
            <h3>elhackerleo</h3>
            <p>Contraseña requerida</p>
            <input type="password" id="inputClave" placeholder="Ingresa la clave">

        <!-- PANTALLA DE DESCARGAS -->

            <h3>Panel de Descargas</h3>
            <p>Aplicaciones de Windows disponibles:</p>
            
            <div class="seccion-descargas">
                <a href="https://drive.google.com/file/d/1K1I8TH8-qz4p1hYNlU6AGc1k0bBA35ev/view?usp=sharing" class="carpeta-link" target="_blank">🖨️ Descargar Driver HP</a>
                <a href="ONLYOFFICEDesktopInstaller%20(1).exe" class="carpeta-link" download>📄 Descargar OFFICE</a>
                <a href="wrar370es%20(1).exe" class="carpeta-link" download>📦 Descargar WinRAR</a>
            </div>
        </div>
    </div>

    <script>
        function verificarClave() {
            var password = document.getElementById('inputClave').value;
            
            if (password === '2004') {
                document.getElementById('pantallaLogin').style.display = 'none';
                document.getElementById('pantallaDescargas').style.display = 'block';
            } else {
                alert('Acceso denegado. Clave incorrecta.');
                document.getElementById('inputClave').value = '';
            }
        }
    </script>

</body>
</html>
